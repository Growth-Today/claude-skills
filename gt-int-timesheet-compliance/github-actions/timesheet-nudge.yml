# Daily timesheet nudge.
#
# Copy this to .github/workflows/timesheet-nudge.yml in the PRIVATE repo that
# holds this skill. Do not add it to a public repo: the run logs print who is
# behind and by how much.
#
# It stays in dry run until the repository variable NUDGE_SEND is set to the
# string "true". Watch a week of dry runs first, then flip it.

name: Timesheet nudge

# One fire per timezone group, and each fire only looks at its own group. That
# pairing is the point: GitHub runs scheduled jobs late, by half an hour on a
# good day and by nearly three hours on a bad one, so the window each fire lands
# in has to be hours wide. A wide window plus a fire that looks at everybody
# would DM the same person twice in an afternoon. Wide window plus one group per
# fire cannot.
#
# Each cron is set so that even the earliest possible fire is at or after 16:00
# local for its group, all year:
#
#   08:00 UTC  Manila, UTC+8, no daylight saving        16:00 local
#   10:30 UTC  Kolkata, UTC+5:30, no daylight saving    16:00 local
#   15:00 UTC  Budapest, UTC+2 summer and UTC+1 winter  17:00 or 16:00 local
#              Johannesburg, UTC+2, no daylight saving  17:00 local
#
# Never move a cron earlier without checking the winter case. A fire before
# 16:00 local falls outside the window and that group is silently skipped.
on:
  schedule:
    - cron: "0 8 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the local-time window and show everyone who is behind"
        type: boolean
        default: false

# Never let two runs overlap. Without this a slow run plus the next fire could
# double-send to the same person.
concurrency:
  group: timesheet-nudge
  cancel-in-progress: false

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Work out who is behind
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_WORKSPACE_GID: ${{ secrets.ASANA_WORKSPACE_GID }}
          ROSTER_JSON: ${{ secrets.ROSTER_JSON }}
        working-directory: scripts
        run: |
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi

          # Which group this fire owns. A manual run leaves it empty and looks at
          # everybody, which is what you want when testing. Keep these strings
          # identical to the cron lines above: they are matched verbatim, and a
          # rewritten cron with a stale case here skips that group in silence.
          case "${{ github.event.schedule }}" in
            "0 8 * * 1-5")   ZONES="Asia/Manila" ;;
            "30 10 * * 1-5") ZONES="Asia/Kolkata" ;;
            "0 15 * * 1-5")  ZONES="Europe/Budapest,Africa/Johannesburg" ;;
            *)               ZONES="" ;;
          esac
          if [ -n "$ZONES" ]; then echo "This fire owns: $ZONES"; fi

          python who_is_behind.py $FORCE ${ZONES:+--timezones "$ZONES"} \
            > "$RUNNER_TEMP/targets.json"

      - name: Send the DMs
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ROSTER_JSON: ${{ secrets.ROSTER_JSON }}
        working-directory: scripts
        run: |
          # Dry run unless the repository variable NUDGE_SEND is exactly "true".
          SEND=""
          if [ "${{ vars.NUDGE_SEND }}" = "true" ]; then SEND="--send"; fi
          python send_nudges.py --targets "$RUNNER_TEMP/targets.json" $SEND

      - name: Say so in Slack if this run broke
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ secrets.SLACK_ALERT_CHANNEL }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TEXT=":warning: Timesheet nudge failed. Nobody was nudged on this run. $RUN_URL"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$(python -c 'import json,os;print(json.dumps({"channel":os.environ["CHANNEL"],"text":os.environ["TEXT"]}))')" \
            > /dev/null
        continue-on-error: true
